<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Kiểm tra đạo văn PRO</title>

<style>
body {
    font-family: 'Segoe UI';
    background: linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.container {
    max-width: 1000px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

h1{text-align:center;}

.flex{ display:flex; gap:15px; }

textarea{
    width:100%;
    height:140px;
    padding:10px;
    border-radius:10px;
}

button{
    margin:5px;
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#667eea;
    color:white;
    cursor:pointer;
}

/* LOADING */
.loader{
    display:none;
    margin:15px auto;
    border:5px solid #eee;
    border-top:5px solid #667eea;
    border-radius:50%;
    width:40px;
    height:40px;
    animation:spin 1s linear infinite;
}
@keyframes spin{100%{transform:rotate(360deg);}}

/* PROGRESS */
.progress{
    background:#eee;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    height:20px;
    width:0%;
    border-radius:20px;
    background: linear-gradient(90deg, red, orange, yellow, green);
    background-size: 300% 100%;
    animation: move 2s linear infinite;
}
@keyframes move{
    0%{background-position:0%;}
    100%{background-position:100%;}
}

.highlight{background:yellow;}
.box{border:1px solid #ccc; padding:10px; border-radius:10px;}
.history{border:1px solid #ccc; padding:10px; margin-top:10px;}

#scan{text-align:center; margin-top:10px;}
#result{text-align:center; font-weight:bold; margin-top:10px;}
</style>
</head>

<body>

<div class="container">
<h1>🤖 Kiểm tra đạo văn PRO</h1>

<div class="flex">
<textarea id="t1" placeholder="Nhập văn bản 1"></textarea>
<textarea id="t2" placeholder="Nhập văn bản 2"></textarea>
</div>

<br>

<button onclick="compare()">🔍 So sánh</button>
<button onclick="clearAll()">🗑 Xóa</button>
<button onclick="copyResult()">📋 Copy</button>
<button onclick="clearHistory()">🧹 Xóa lịch sử</button>

<div id="loader" class="loader"></div>
<div id="scan"></div>

<div class="progress"><div id="bar" class="bar"></div></div>
<div id="result"></div>

<h3>📌 Nội dung trùng:</h3>
<div class="flex">
<div id="h1" class="box"></div>
<div id="h2" class="box"></div>
</div>

<h3>🕒 Lịch sử:</h3>
<div id="history" class="history">Chưa có dữ liệu</div>

</div>

<script>
let beep = new Audio("https://www.soundjay.com/buttons/sounds/button-16.mp3");

function preprocess(t){
 return t.toLowerCase().replace(/\s+/g,' ').trim();
}

function compare(){
 beep.play();

 let loader=document.getElementById("loader");
 let scan=document.getElementById("scan");

 loader.style.display="block";

 let text1=document.getElementById("t1").value;
 let words=text1.split(" ");
 let i=0;

 let scanInterval=setInterval(()=>{
    scan.innerText="🤖 Đang quét: "+ (words[i] || "");
    i++;
    if(i>words.length){
        clearInterval(scanInterval);
        scan.innerText="🔎 Đang phân tích...";
    }
 },100);

 setTimeout(()=>{
    runCompare();
    loader.style.display="none";
    scan.innerText="✅ Hoàn tất!";
 },2000);
}

function runCompare(){
 let t1=document.getElementById("t1").value;
 let t2=document.getElementById("t2").value;

 let a=preprocess(t1);
 let b=preprocess(t2);

 let w1=a.split(" ");
 let w2=b.split(" ");

 let common=w1.filter(w=>w2.includes(w));

 let sim=(common.length/Math.max(w1.length,w2.length))*100;

 document.getElementById("bar").style.width=sim+"%";
 document.getElementById("result").innerText="Độ giống nhau: "+sim.toFixed(2)+"%";

 highlight(w1,w2,common);
 saveHistory(sim);
}

function highlight(w1,w2,common){
 document.getElementById("h1").innerHTML =
 w1.map(w=>common.includes(w)?`<span class="highlight">${w}</span>`:w).join(" ");

 document.getElementById("h2").innerHTML =
 w2.map(w=>common.includes(w)?`<span class="highlight">${w}</span>`:w).join(" ");
}

function clearAll(){
 document.getElementById("t1").value="";
 document.getElementById("t2").value="";
}

function copyResult(){
 let text=document.getElementById("result").innerText;
 navigator.clipboard.writeText(text);
 alert("Đã copy!");
}

function saveHistory(sim){
 let h=JSON.parse(localStorage.getItem("his")||"[]");
 let time=new Date().toLocaleTimeString();
 h.push(time+" - "+sim.toFixed(2)+"%");
 localStorage.setItem("his",JSON.stringify(h));
 loadHistory();
}

function loadHistory(){
 let h=JSON.parse(localStorage.getItem("his")||"[]");
 document.getElementById("history").innerHTML =
 h.length? h.join("<br>") : "Chưa có dữ liệu";
}

function clearHistory(){
 localStorage.removeItem("his");
 loadHistory();
}

loadHistory();
</script>

</body>
</html>
